<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sticks Game</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #000; }
  body { color: #ffffff; font-family: "Courier New", Consolas, monospace; font-size: 16px; }
  #term { box-sizing: border-box; height: 100%; max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; }
  #out { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .err { color: #ff5555; }
  .win { color: #ffd34d; }
  .dim { color: #9a9a9a; }
  #row { display: flex; align-items: center; gap: 8px; padding-top: 8px; }
  #label { white-space: nowrap; }
  #inp { flex: 1; min-width: 0; background: #000; color: #ffffff; border: 0; font: inherit; outline: none; padding: 4px 0; caret-color: #ffffff; }
  #btns { display: flex; gap: 8px; padding-top: 12px; }
  #btns button { flex: 1; background: #000; color: #33ff66; border: 1px solid #33ff66; font: inherit; padding: 10px 0; border-radius: 4px; cursor: pointer; }
  #btns button:hover, #btns button:active { background: #33ff66; color: #000; }
</style>
</head>
<body>
<div id="term">
  <div id="out"></div>
  <div id="row"><span id="label"></span><input id="inp" type="text" inputmode="numeric" autocomplete="off" autofocus></div>
</div>
<script>
const TOTAL = 16;
let sticks, player, over;
const out = document.getElementById("out");
const inp = document.getElementById("inp");
const label = document.getElementById("label");

function print(text, cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = text;
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}

function showTurn() {
  print("Sticks remaining: " + sticks + "  " + "|".repeat(sticks));
  label.textContent = "Player " + player + ", how many sticks (1-3)?";
}

function start() {
  out.innerHTML = "";
  sticks = TOTAL; player = 1; over = false;
  print("Sticks Game: " + TOTAL + " sticks. Take 1, 2, or 3 per turn.");
  print("The player who takes the last stick LOSES.\n", "dim");
  showTurn();
  inp.focus();
}

function submit(val) {
  val = String(val).trim();
  if (over) { start(); return; }
  print(label.textContent + " " + val, "dim");
  if (!/^-?\d+$/.test(val)) { print("Please enter a number.", "err"); return; }
  const take = parseInt(val, 10);
  if (take < 1 || take > 3) { print("You must take 1, 2, or 3 sticks.", "err"); return; }
  if (take > sticks) { print("Only " + sticks + " stick(s) left. Choose a smaller number.", "err"); return; }
  sticks -= take;
  if (sticks === 0) {
    const other = player === 1 ? 2 : 1;
    print("\nPlayer " + player + " took the last stick and loses!", "win");
    print("Player " + other + " wins!", "win");
    print("\nPress Enter to play again.", "dim");
    label.textContent = ">";
    over = true;
    return;
  }
  player = player === 1 ? 2 : 1;
  print("");
  showTurn();
}

inp.addEventListener("keydown", e => {
  if (e.key === "Enter") { const v = inp.value; inp.value = ""; submit(v); }
});
document.addEventListener("click", () => inp.focus());
start();
</script>
</body>
</html>
